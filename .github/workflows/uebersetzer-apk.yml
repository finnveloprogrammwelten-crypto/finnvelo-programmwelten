# Baut den Finnvelo Übersetzer.
# - Bei jeder Änderung unter android/uebersetzer: Lint + Tests, und - falls die
#   Secrets eingetragen sind - eine mit dem Finnvelo-Schlüssel signierte APK
#   (unter "Artifacts" des Laufs herunterladbar).
# - Von Hand ("Run workflow", Haken "veroeffentlichen"): zusätzlich als
#   GitHub-Release "FinnveloUebersetzer" hochladen.
# Der Schlüssel liegt NIE im Repository, nur verschlüsselt in den Secrets
# (Einrichtung: android/uebersetzer/README.md, Abschnitt "Signieren").
name: Übersetzer-APK

on:
  push:
    paths:
      - "android/uebersetzer/**"
      - ".github/workflows/uebersetzer-apk.yml"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Signierte APK als GitHub-Release FinnveloUebersetzer hochladen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/uebersetzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prüfen (Lint und Tests)
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon

      - name: Schlüssel bereitlegen
        id: schluessel
        env:
          FINNVELO_KEYSTORE_BASE64: ${{ secrets.FINNVELO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FINNVELO_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret FINNVELO_KEYSTORE_BASE64 fehlt - es wird keine signierte APK gebaut (siehe android/uebersetzer/README.md)."
            echo "da=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$FINNVELO_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/finnvelo-release.jks"
          echo "da=ja" >> "$GITHUB_OUTPUT"

      - name: Signierte APK bauen
        if: steps.schluessel.outputs.da == 'ja'
        env:
          FINNVELO_KEYSTORE: ${{ runner.temp }}/finnvelo-release.jks
          FINNVELO_KEYSTORE_PASSWORT: ${{ secrets.FINNVELO_KEYSTORE_PASSWORT }}
          FINNVELO_KEY_ALIAS: ${{ secrets.FINNVELO_KEY_ALIAS }}
          FINNVELO_KEY_PASSWORT: ${{ secrets.FINNVELO_KEY_PASSWORT }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk FinnveloUebersetzer.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs FinnveloUebersetzer.apk | grep -i "certificate DN"

      - name: Schlüssel wegräumen
        if: always()
        run: rm -f "$RUNNER_TEMP/finnvelo-release.jks"

      - name: APK zum Herunterladen ablegen
        if: steps.schluessel.outputs.da == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: FinnveloUebersetzer
          path: android/uebersetzer/FinnveloUebersetzer.apk

      - name: Als GitHub-Release veröffentlichen
        if: steps.schluessel.outputs.da == 'ja' && github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release view FinnveloUebersetzer >/dev/null 2>&1 || \
            gh release create FinnveloUebersetzer --title "Finnvelo Übersetzer" --notes "Android-App: andere Apps und Kamerabilder ins Deutsche übersetzen."
          gh release edit FinnveloUebersetzer --notes "Finnvelo Übersetzer $VERSION – andere Apps und Kamerabilder ins Deutsche übersetzen."
          # Gleicher Dateiname ersetzt die alte APK, die Download-Adresse bleibt gleich
          gh release upload FinnveloUebersetzer FinnveloUebersetzer.apk --clobber
          echo "Download: https://github.com/${{ github.repository }}/releases/download/FinnveloUebersetzer/FinnveloUebersetzer.apk"
